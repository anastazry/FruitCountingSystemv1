services:
  - type: web
    name: fruit-counting-system
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/anastazry/FruitCountingSystemv1
    branch: master
    autoDeployTrigger: commit
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Fruit Counting System
      - key: APP_TIMEZONE
        value: Asia/Singapore
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_DIRECT_URL
        sync: false
      - key: HARVEST_PHOTO_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_BUCKET
        value: harvest-photos
      - key: AWS_DEFAULT_REGION
        value: ap-southeast-1
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: log
